apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pixelforge-pipeline
  namespace: pixelforge
  labels:
    release: monitoring #allow to be discovered by prometheus
#alert generated by codex
spec:
  groups:
    - name: pixelforge.pipeline
      rules:
        - alert: PixelforgeUploadsAcceptedButNoneCompleted
          # Uploads entered in 10m, but no job completed in the same window.
          expr: |
            sum(increase(pixelforge_uploads_total{result="accepted"}[10m])) > 0
            and on()
            sum(increase(pixelforge_jobs_processed_total{status="complete"}[10m])) == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Uploads are accepted but no jobs are completing"
            runbook: "Check worker replicas, KEDA status, SQS access, then worker logs."

        - alert: PixelforgeWorkerMaxedBacklogGrowing
          # The generated HPA is at max while KEDA's queue signal still rises.
          expr: |
            (
              max(kube_horizontalpodautoscaler_status_current_replicas{
                namespace="pixelforge",
                horizontalpodautoscaler="keda-hpa-pixelforge-worker"
              })
              >=
              max(kube_horizontalpodautoscaler_spec_max_replicas{
                namespace="pixelforge",
                horizontalpodautoscaler="keda-hpa-pixelforge-worker"
              })
            )
            and on()
            (
              max(deriv(keda_scaler_metrics_value{
                exported_namespace="pixelforge",
                scaledObject="pixelforge-worker"
              }[5m])) > 0
            )
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Worker is maxed while the SQS backlog grows"
            runbook: "Check Pending pods and node capacity, then processing latency and AWS errors."
