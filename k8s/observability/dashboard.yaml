apiVersion: v1
kind: ConfigMap
metadata:
  name: pixelforge-dashboard
  namespace: pixelforge
  labels:
    grafana_dashboard: "1" #prom sidecar can pick it up

#dashboard generated by codex
data:
  pixelforge.json: |-
    {
      "title": "pixelforge · queue to completion",
      "uid": "pixelforge-loop",
      "schemaVersion": 41,
      "time": { "from": "now-30m", "to": "now" },
      "refresh": "10s",
      "panels": [
        {
          "type": "timeseries",
          "title": "Visible SQS backlog seen by KEDA",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "refId": "A",
            "expr": "keda_scaler_metrics_value{exported_namespace=\"pixelforge\",scaledObject=\"pixelforge-worker\"}",
            "legendFormat": "visible messages"
          }],
          "fieldConfig": { "defaults": { "min": 0 } },
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 0 }
        },
        {
          "type": "timeseries",
          "title": "Worker replicas",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{
            "refId": "A",
            "expr": "kube_deployment_status_replicas{namespace=\"pixelforge\",deployment=\"pixelforge-worker\"}",
            "legendFormat": "replicas"
          }],
          "fieldConfig": { "defaults": { "min": 0, "decimals": 0 } },
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 9 }
        }
      ]
    }

